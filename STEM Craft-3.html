<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STEM Craft</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --blue-50:#eaf2fb; --lav-50:#f1ecfb; --white:#ffffff;
  --ink:#20264a; --ink-soft:#565f8c;
  --grad-1:#5b7fe8; --grad-2:#9c7ef0;
  --teal:#2fc6c2; --amber:#f0a94a; --coral:#f2685f;
  --card-border:rgba(91,127,232,.14);
  --shadow: 0 8px 28px rgba(43,58,103,.10);
  --radius: 18px;
  padding-top: env(safe-area-inset-top,0px);
  padding-bottom: env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]){}
*{box-sizing:border-box;}
html,body{height:100%;}
html{scroll-padding-top: env(safe-area-inset-top,0px);}
body{
  margin:0; font-family:'Inter',sans-serif; color:var(--ink);
  background:
    radial-gradient(1200px 600px at 10% -10%, var(--blue-50), transparent),
    radial-gradient(1000px 600px at 100% 0%, var(--lav-50), transparent),
    var(--white);
  min-height:100%;
}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px;}

/* Header */
header.top{
  position:sticky; top:0; z-index:40;
  padding-top: calc(10px + env(safe-area-inset-top,0px));
  background:rgba(255,255,255,.78); backdrop-filter:blur(14px);
  border-bottom:1px solid var(--card-border);
}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:8px 18px 12px;max-width:1040px;margin:0 auto;}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.12rem;letter-spacing:-.01em;}
.logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--grad-1),var(--grad-2));position:relative;flex:none;}
.logo .mark::after{content:"";position:absolute;inset:8px;border:2px solid #fff;border-radius:5px;opacity:.9;}
.langsw{display:flex;gap:2px;background:var(--blue-50);border-radius:100px;padding:3px;}
.langsw button{border:none;background:transparent;padding:6px 11px;border-radius:100px;font-size:.78rem;font-weight:600;color:var(--ink-soft);cursor:pointer;}
.langsw button.on{background:var(--white);color:var(--ink);box-shadow:var(--shadow);}
.demo-btn{padding:8px 12px;font-size:.74rem;white-space:nowrap;text-decoration:none;flex:none;}
@media(max-width:420px){.demo-btn span.dl-text{display:none;}}
nav.desktop-nav{display:none;}
@media(min-width:840px){
  nav.desktop-nav{display:flex;gap:2px;background:var(--blue-50);border-radius:100px;padding:4px;margin:0 14px;}
  nav.desktop-nav button{border:none;background:transparent;padding:9px 16px;border-radius:100px;font-size:.86rem;font-weight:600;color:var(--ink-soft);cursor:pointer;}
  nav.desktop-nav button.on{background:var(--white);color:var(--ink);box-shadow:var(--shadow);}
}

/* Bottom nav (mobile) */
nav.bottom{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex; justify-content:space-around;
  background:rgba(255,255,255,.9); backdrop-filter:blur(14px);
  border-top:1px solid var(--card-border);
  padding: 8px 6px calc(8px + env(safe-area-inset-bottom,0px));
}
@media(min-width:840px){nav.bottom{display:none;}}
nav.bottom button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.64rem;color:var(--ink-soft);font-weight:600;padding:4px 8px;cursor:pointer;}
nav.bottom button.on{color:var(--grad-1);}
nav.bottom .ic{width:20px;height:20px;}

main{padding:22px 0 90px;}
@media(min-width:840px){main{padding-bottom:40px;}}

.hero{
  border-radius:24px; padding:34px 26px; margin-bottom:22px;
  background:linear-gradient(135deg,var(--blue-50),var(--lav-50));
  border:1px solid var(--card-border); position:relative; overflow:hidden;
}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(156,126,240,.25),transparent 70%);}
.hero .eyebrow{font-size:.78rem;font-weight:600;color:var(--grad-1);}
.hero h1{font-size:1.7rem;line-height:1.18;margin:8px 0 10px;max-width:20ch;}
.hero p{color:var(--ink-soft);max-width:44ch;margin:0 0 18px;font-size:.94rem;line-height:1.5;}
.hero .cta-row{display:flex;gap:10px;flex-wrap:wrap;}
.btn{border:none;border-radius:13px;padding:12px 18px;font-weight:700;font-size:.88rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
.btn.primary{background:linear-gradient(135deg,var(--grad-1),var(--grad-2));color:#fff;box-shadow:0 10px 24px rgba(91,127,232,.35);}
.btn.ghost{background:var(--white);color:var(--ink);border:1px solid var(--card-border);}
.btn:active{transform:scale(.98);}

.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;}
.section-title h2{font-size:1.05rem;margin:0;}
.section-title span{font-size:.78rem;color:var(--ink-soft);}

.grid{display:grid;gap:12px;}
.grid.cols2{grid-template-columns:1fr 1fr;}
.grid.cols3{grid-template-columns:repeat(3,1fr);}
@media(max-width:640px){.grid.cols3{grid-template-columns:1fr 1fr;}}

.card{
  background:var(--white); border:1px solid var(--card-border); border-radius:var(--radius);
  padding:16px; box-shadow:var(--shadow); cursor:pointer;
}
.card h3{font-size:.94rem;margin:8px 0 4px;}
.card p{font-size:.78rem;color:var(--ink-soft);margin:0;line-height:1.4;}
.chip{display:inline-flex;align-items:center;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:100px;background:var(--blue-50);color:var(--grad-1);margin-bottom:4px;}
.icon-tile{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;margin-bottom:6px;}

.stat-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px;}
.stat{flex:1;min-width:96px;background:var(--white);border:1px solid var(--card-border);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);}
.stat .n{font-family:'Space Grotesk';font-weight:700;font-size:1.2rem;}
.stat .l{font-size:.7rem;color:var(--ink-soft);}

.fact{border-radius:18px;padding:16px 18px;background:linear-gradient(135deg,#fff, var(--lav-50));border:1px solid var(--card-border);font-size:.85rem;color:var(--ink-soft);}
.fact b{color:var(--ink);}

/* Panel / page views */
.view{display:none;}
.view.active{display:block;animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.panel{background:var(--white);border:1px solid var(--card-border);border-radius:20px;padding:20px;box-shadow:var(--shadow);}
.panel + .panel{margin-top:14px;}

textarea, input[type=text]{
  width:100%;border:1.5px solid var(--card-border);border-radius:14px;padding:13px 14px;
  font-family:inherit;font-size:.92rem;resize:vertical;background:var(--blue-50);color:var(--ink);
}
textarea:focus,input:focus{outline:2px solid var(--grad-1);outline-offset:1px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
.eg-chip{border:1px solid var(--card-border);background:var(--white);border-radius:100px;padding:7px 13px;font-size:.78rem;cursor:pointer;color:var(--ink-soft);}
.eg-chip:hover{border-color:var(--grad-1);color:var(--grad-1);}

.spec-block{border-left:3px solid var(--grad-1);padding:4px 0 4px 14px;margin:14px 0;}
.spec-block h4{margin:0 0 4px;font-size:.86rem;}
.spec-block p,.spec-block ul{margin:0;font-size:.85rem;color:var(--ink-soft);line-height:1.55;}
.spec-block ul{padding-left:18px;}
.safety{background:#fff4ea;border:1px solid #f3d9b8;border-radius:14px;padding:12px 14px;font-size:.8rem;color:#8a5a1c;}

.progressbar{height:6px;border-radius:100px;background:var(--blue-50);overflow:hidden;margin:10px 0 18px;}
.progressbar > div{height:100%;background:linear-gradient(90deg,var(--grad-1),var(--grad-2));transition:width .3s;}

.steps-nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
.steps-nav span{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;background:var(--blue-50);color:var(--ink-soft);}
.steps-nav span.done{background:var(--teal);color:#fff;}
.steps-nav span.on{background:var(--grad-1);color:#fff;}

.sensor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0;}
@media(min-width:640px){.sensor-grid{grid-template-columns:repeat(3,1fr);}}
.sensor-tile{border:1px solid var(--card-border);border-radius:14px;padding:12px;text-align:center;background:var(--blue-50);}
.sensor-tile .v{font-family:'Space Grotesk';font-weight:700;font-size:1.15rem;}
.sensor-tile .u{font-size:.68rem;color:var(--ink-soft);}
.sensor-tile.off{opacity:.45;}

canvas{width:100%;height:150px;display:block;border-radius:14px;background:var(--blue-50);}

.camview{position:relative;border-radius:18px;overflow:hidden;background:#0e1330;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;}
.camview video{width:100%;height:100%;object-fit:cover;}
.camview .cam-msg{color:#c9d3ff;font-size:.85rem;text-align:center;padding:20px;}
.scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--teal),transparent);animation:scan 1.8s linear infinite;}
@keyframes scan{0%{top:6%;}100%{top:94%;}}
.detect-label{position:absolute;background:rgba(20,26,60,.75);color:#eaf7f6;font-size:.7rem;padding:4px 8px;border-radius:100px;border:1px solid rgba(47,198,194,.5);}

.badge-warn{color:var(--amber);}
.badge-ok{color:var(--teal);}

footer.settings-line{font-size:.75rem;color:var(--ink-soft);text-align:center;padding:18px 0 4px;}

.offline-pill{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#20264a;color:#fff;font-size:.72rem;font-weight:600;padding:7px 14px;border-radius:100px;z-index:50;display:none;box-shadow:var(--shadow);}
.offline-pill.show{display:block;}

.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--card-border);}
.toggle:last-child{border-bottom:none;}
.switch{width:42px;height:24px;border-radius:100px;background:var(--blue-50);position:relative;cursor:pointer;flex:none;}
.switch.on{background:linear-gradient(135deg,var(--grad-1),var(--grad-2));}
.switch i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on i{left:21px;}

.projcard{display:flex;justify-content:space-between;align-items:center;}
.status-pill{font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:100px;}
.status-pill.done{background:#e4f9f0;color:#1a9a6d;}
.status-pill.prog{background:#fef0e0;color:#c17d1e;}
</style>
</head>
<body>

<div class="offline-pill" id="offlinePill"></div>

<header class="top">
  <div class="topbar">
    <div class="logo"><div class="mark"></div><span id="brandName">STEM Craft</span></div>
    <nav class="desktop-nav" id="deskNav"></nav>
    <a class="btn primary demo-btn" id="demoLinkBtn" href="https://claude.ai/artifact/E8btE4jwkyVEY5NT8S3wh8" target="_blank" rel="noopener"></a>
    <div class="langsw" id="langsw">
      <button data-l="kk">ҚАЗ</button>
      <button data-l="ru" class="on">RU</button>
      <button data-l="en">EN</button>
    </div>
  </div>
</header>

<main class="wrap">

  <!-- HOME -->
  <section class="view active" id="view-home">
    <div class="hero">
      <div class="eyebrow" id="h-eyebrow"></div>
      <h1 id="h-title"></h1>
      <p id="h-sub"></p>
      <div class="cta-row">
        <button class="btn primary" onclick="go('lab')" id="h-cta1"></button>
        <button class="btn ghost" onclick="go('experiments')" id="h-cta2"></button>
      </div>
    </div>

    <div class="stat-row" id="statRow"></div>

    <div class="section-title"><h2 id="t-continue"></h2></div>
    <div class="grid cols3" id="quickActions"></div>

    <div class="section-title"><h2 id="t-fields"></h2></div>
    <div class="grid cols3" id="fieldsGrid"></div>

    <div class="section-title"><h2 id="t-popular"></h2><span id="t-viewall" onclick="go('experiments')" style="cursor:pointer"></span></div>
    <div class="grid cols3" id="popularGrid"></div>

    <div class="section-title"><h2 id="t-fact"></h2></div>
    <div class="fact" id="factBox"></div>
  </section>

  <!-- LAB GENERATOR -->
  <section class="view" id="view-lab">
    <div class="panel">
      <h2 id="l-title" style="margin-top:0"></h2>
      <p id="l-sub" style="color:var(--ink-soft);font-size:.88rem"></p>
      <textarea id="ideaInput" rows="2"></textarea>
      <div class="chips" id="egChips"></div>
      <button class="btn primary" onclick="generateSpec()" id="l-btn"></button>
    </div>
    <div class="panel" id="specPanel" style="display:none"></div>
  </section>

  <!-- BUILDER -->
  <section class="view" id="view-builder">
    <div class="panel">
      <div class="steps-nav" id="stepsNav"></div>
      <div class="progressbar"><div id="buildProg" style="width:16%"></div></div>
      <div id="stepBody"></div>
      <div class="cta-row" style="margin-top:16px">
        <button class="btn ghost" onclick="prevStep()" id="b-prev"></button>
        <button class="btn primary" onclick="nextStep()" id="b-next"></button>
      </div>
    </div>
  </section>

  <!-- SENSORS / MEASUREMENT -->
  <section class="view" id="view-sensors">
    <div class="panel">
      <div class="section-title" style="margin-top:0"><h2 id="s-title"></h2><span id="s-demo-tag"></span></div>
      <div class="sensor-grid" id="sensorGrid"></div>
      <canvas id="liveChart" width="600" height="150"></canvas>
      <div class="cta-row" style="margin-top:14px">
        <button class="btn primary" id="s-start" onclick="toggleMeasure()"></button>
        <button class="btn ghost" id="s-reset" onclick="resetMeasure()"></button>
      </div>
    </div>
  </section>

  <!-- SEISMOGRAPH -->
  <section class="view" id="view-seismo">
    <div class="panel">
      <div class="section-title" style="margin-top:0"><h2 id="sm-title"></h2><span class="chip" id="sm-status-chip"></span></div>
      <div class="safety" id="sm-warning" style="margin-bottom:14px"></div>

      <div id="sm-unsupported" style="display:none" class="fact"></div>
      <div id="sm-ios-permission" style="display:none;margin-bottom:10px" class="fact"></div>

      <canvas id="seismoChart" width="600" height="160"></canvas>

      <div class="sensor-grid" id="sm-xyz" style="margin-top:12px"></div>

      <div class="stat-row" style="margin-top:4px">
        <div class="stat"><div class="n" id="sm-level-n">—</div><div class="l" id="sm-level-l"></div></div>
        <div class="stat"><div class="n" id="sm-mag-n">0.00</div><div class="l">m/s²</div></div>
      </div>

      <div id="sm-calib-wrap" style="display:none;margin-top:12px">
        <p style="font-size:.82rem;color:var(--ink-soft)" id="sm-calib-text"></p>
        <div class="progressbar"><div id="sm-calib-bar" style="width:0%"></div></div>
      </div>

      <div style="margin-top:14px">
        <label style="font-size:.78rem;font-weight:600;color:var(--ink-soft)" id="sm-sens-label"></label>
        <input type="range" id="sm-sensitivity" min="1" max="5" value="3" style="width:100%;accent-color:#5b7fe8">
      </div>

      <div class="cta-row" style="margin-top:14px">
        <button class="btn primary" id="sm-start" onclick="startSeismo()"></button>
        <button class="btn ghost" id="sm-stop" onclick="stopSeismo()" style="display:none"></button>
        <button class="btn ghost" id="sm-recalib" onclick="beginCalibration()" style="display:none"></button>
      </div>
    </div>
  </section>

  <!-- SCANNER -->
  <section class="view" id="view-scanner">
    <div class="panel">
      <h2 id="sc-title" style="margin-top:0"></h2>
      <p id="sc-sub" style="color:var(--ink-soft);font-size:.88rem"></p>
      <div class="camview" id="camBox">
        <div class="cam-msg" id="camMsg"></div>
      </div>
      <div class="cta-row" style="margin-top:14px">
        <button class="btn primary" onclick="startScan()" id="sc-btn"></button>
      </div>
      <div id="scanResults" style="margin-top:14px"></div>
    </div>
  </section>

  <!-- RESULTS -->
  <section class="view" id="view-results">
    <div class="panel">
      <div class="chip" id="res-chip"></div>
      <h2 id="res-title" style="margin:6px 0 2px"></h2>
      <p id="res-sub" style="color:var(--ink-soft);font-size:.85rem"></p>
      <div class="stat-row" id="resStats"></div>
      <canvas id="resChart" width="600" height="150" style="margin-top:14px"></canvas>
      <div class="cta-row" style="margin-top:16px">
        <button class="btn primary" onclick="exportCSV()" id="res-export"></button>
        <button class="btn ghost" onclick="saveProject()" id="res-save"></button>
        <button class="btn ghost" onclick="go('lab')" id="res-new"></button>
      </div>
    </div>
  </section>

  <!-- PROJECTS -->
  <section class="view" id="view-projects">
    <div class="section-title" style="margin-top:0"><h2 id="p-title"></h2></div>
    <div id="projList" style="display:flex;flex-direction:column;gap:10px"></div>
  </section>

  <!-- SETTINGS -->
  <section class="view" id="view-settings">
    <div class="panel">
      <h2 id="set-title" style="margin-top:0"></h2>
      <div class="toggle">
        <div><b id="set-demo-l"></b><div style="font-size:.76rem;color:var(--ink-soft)" id="set-demo-d"></div></div>
        <div class="switch on" id="demoSwitch" onclick="toggleDemo()"><i></i></div>
      </div>
      <div class="toggle">
        <div><b id="set-lang-l"></b></div>
        <div class="langsw" id="langsw2"></div>
      </div>
    </div>
    <div class="panel">
      <h2 id="share-title" style="margin-top:0"></h2>
      <p id="share-sub" style="color:var(--ink-soft);font-size:.86rem"></p>
      <div style="display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:10px">
        <div id="qrBox" style="background:#fff;padding:10px;border-radius:14px;border:1px solid var(--card-border);flex:none"></div>
        <div style="flex:1;min-width:200px">
          <div style="background:var(--blue-50);border-radius:12px;padding:10px 12px;font-size:.78rem;word-break:break-all;color:var(--ink-soft)" id="shareUrlText"></div>
          <button class="btn primary" style="margin-top:10px" onclick="copyDemoLink()" id="copyBtn"></button>
        </div>
      </div>
    </div>
    <footer class="settings-line" id="footerNote"></footer>
  </section>

</main>

<nav class="bottom" id="bottomNav"></nav>

<script>
/* ---------------- i18n ---------------- */
const STR = {
  brand:{en:"STEM Craft",ru:"STEM Craft",kk:"STEM Craft"},
  navHome:{en:"Home",ru:"Главная",kk:"Басты бет"},
  navLab:{en:"Lab",ru:"Лаборатория",kk:"Зертхана"},
  navExp:{en:"Experiments",ru:"Эксперименты",kk:"Тәжірибелер"},
  navProj:{en:"My Projects",ru:"Мои проекты",kk:"Менің жобаларым"},
  navSettings:{en:"Settings",ru:"Настройки",kk:"Баптаулар"},
  heroEyebrow:{en:"Hard-to-access equipment — accessible technology",ru:"Труднодоступное оборудование — доступная технология",kk:"Қолжетімсіз жабдық — қолжетімді технология"},
  heroTitle:{en:"Your STEM laboratory in your smartphone",ru:"STEM-лаборатория в твоём смартфоне",kk:"STEM зертханасы смартфоныңда"},
  heroSub:{en:"Create experiments, use smartphone sensors, and analyze real data — without professional laboratory equipment.",
           ru:"Создавай эксперименты, используй датчики смартфона и анализируй реальные данные — даже без профессионального оборудования.",
           kk:"Тәжірибелер жаса, смартфон датчиктерін пайдалан және нақты деректерді талда — кәсіби зертханалық жабдықсыз."},
  ctaCreate:{en:"Create Experiment",ru:"Создать эксперимент",kk:"Тәжірибе жасау"},
  ctaExplore:{en:"Explore Experiments",ru:"Посмотреть эксперименты",kk:"Тәжірибелерді көру"},
  statExp:{en:"Experiments run",ru:"Проведено опытов",kk:"Өткізілген тәжірибе"},
  statSensor:{en:"Sensors used",ru:"Использовано датчиков",kk:"Пайдаланылған датчик"},
  statProgress:{en:"STEM progress",ru:"Прогресс STEM",kk:"STEM үлгерімі"},
  tContinue:{en:"Quick actions",ru:"Быстрые действия",kk:"Жылдам әрекеттер"},
  tFields:{en:"Choose your STEM field",ru:"Выберите направление STEM",kk:"STEM бағытын таңдаңыз"},

function drawChart(id, data){
  const cv = document.getElementById(id); if(!cv) return;
  const ctx = cv.getContext('2d');
  const w=cv.width,h=cv.height;
  ctx.clearRect(0,0,w,h);
  if(data.length<2) return;
  const max=Math.max(...data,0.1), min=Math.min(...data,-0.1);
  const range = (max-min)||1;
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'rgba(91,127,232,0.35)'); grad.addColorStop(1,'rgba(91,127,232,0.02)');
  ctx.beginPath();
  data.forEach((d,i)=>{
    const x = i/(data.length-1)*w;
    const y = h - ((d-min)/range)*h*0.8 - h*0.1;
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#5b7fe8'; ctx.lineWidth=2.4; ctx.lineJoin='round'; ctx.stroke();
  ctx.lineTo(w,h); ctx.lineTo(0,h); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
}

/* ---------------- seismograph ---------------- */
// All processing below runs entirely client-side; no accelerometer data ever leaves the device.
const SM = {
  state: 'idle',            // idle | calibrating | measuring
  usingSynthetic: false,    // true if DeviceMotion is unsupported and we're faking a demo waveform
  motionListener: null,
  syntheticTimer: null,
  rafId: null,
  needsRedraw: false,
  samples: [],               // {t, x, y, z, mag} within display window
  calibStart: 0,
  calibSamples: [],
  calibDurationMs: 3000,
  baselineMean: 0,
  baselineStd: 0.05,
  lastX:0, lastY:0, lastZ:0, lastMag:0,
  smoothedMag: 0,
  aboveCount: 0,
  belowCount: 0,
  detected: false,
  sensitivity: 3,            // 1 (least sensitive) .. 5 (most sensitive)
  gravX:0, gravY:0, gravZ:0,  // low-pass estimate used only if acceleration-without-gravity is unavailable
  haveGravEstimate: false,
};
const SM_WINDOW_MS = 15000; // ~15s of history shown, within the requested 10-20s range

function sensitivityMultiplier(){
  // Lower multiplier = more sensitive (trips sooner above baseline noise)
  const map = {1:7, 2:5.5, 3:4, 4:2.8, 5:1.8};
  return map[SM.sensitivity] || 4;
}

async function startSeismo(){
  if(SM.state !== 'idle') return;
  const supported = 'DeviceMotionEvent' in window;
  document.getElementById('sm-unsupported').style.display = supported ? 'none' : 'block';

  if(supported && typeof DeviceMotionEvent.requestPermission === 'function'){
    // iOS 13+ requires an explicit user-gesture permission request — triggered here by the Start tap only.
    document.getElementById('sm-ios-permission').style.display = 'block';
    try{
      const res = await DeviceMotionEvent.requestPermission();
      document.getElementById('sm-ios-permission').style.display = 'none';
      if(res !== 'granted'){
        document.getElementById('sm-unsupported').textContent = t('smPermDenied');
        document.getElementById('sm-unsupported').style.display = 'block';
        return;
      }
    }catch(e){
      document.getElementById('sm-ios-permission').style.display = 'none';
      document.getElementById('sm-unsupported').textContent = t('smPermDenied');
      document.getElementById('sm-unsupported').style.display = 'block';
      return;
    }
  }

  SM.usingSynthetic = !supported;
  document.getElementById('sm-start').style.display = 'none';
  document.getElementById('sm-stop').style.display = 'inline-flex';
  document.getElementById('sm-recalib').style.display = 'none';
  document.getElementById('sm-sensitivity').value = SM.sensitivity;

  if(SM.usingSynthetic){
    attachSyntheticMotion();
  } else {
    SM.motionListener = handleMotion;
    window.addEventListener('devicemotion', SM.motionListener, {passive:true});
  }
  startAnimationLoop();
  beginCalibration();
}

function stopSeismo(){
  if(SM.motionListener){ window.removeEventListener('devicemotion', SM.motionListener); SM.motionListener=null; }
  if(SM.syntheticTimer){ clearInterval(SM.syntheticTimer); SM.syntheticTimer=null; }
  if(SM.rafId){ cancelAnimationFrame(SM.rafId); SM.rafId=null; }
  SM.state = 'idle';
  SM.samples = [];
  SM.detected = false;
  document.getElementById('sm-start').style.display = 'inline-flex';
  document.getElementById('sm-stop').style.display = 'none';
  document.getElementById('sm-recalib').style.display = 'none';
  document.getElementById('sm-calib-wrap').style.display = 'none';
  updateSeismoStatusUI();
  drawSeismoChart();
}

function beginCalibration(){
  SM.state = 'calibrating';
  SM.calibSamples = [];
  SM.calibStart = performance.now();
  document.getElementById('sm-calib-wrap').style.display = 'block';
  document.getElementById('sm-recalib').style.display = 'none';
  updateSeismoStatusUI();
}

function finishCalibration(){
  const vals = SM.calibSamples.length ? SM.calibSamples : [0];
  const mean = vals.reduce((a,b)=>a+b,0)/vals.length;
  const variance = vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/vals.length;
  SM.baselineMean = mean;
  SM.baselineStd = Math.max(Math.sqrt(variance), 0.015); // floor avoids div-by-near-zero on very quiet sensors
  SM.state = 'measuring';
  SM.aboveCount = 0; SM.belowCount = 0; SM.detected = false;
  document.getElementById('sm-calib-wrap').style.display = 'none';
  document.getElementById('sm-recalib').style.display = 'inline-flex';
  updateSeismoStatusUI();
}

function handleMotion(ev){
  const now = performance.now();
  let x,y,z;
  const lin = ev.acceleration;
  const withG = ev.accelerationIncludingGravity;
  if(lin && (lin.x!==null && lin.x!==undefined)){
    // Preferred: browser already removes gravity for us.
    x=lin.x||0; y=lin.y||0; z=lin.z||0;
  } else if(withG && withG.x!==null && withG.x!==undefined){
    // Fallback: estimate gravity/orientation with a slow low-pass filter, subtract it to isolate fast vibration.
    const alpha = 0.92;
    if(!SM.haveGravEstimate){ SM.gravX=withG.x; SM.gravY=withG.y; SM.gravZ=withG.z; SM.haveGravEstimate=true; }
    SM.gravX = alpha*SM.gravX + (1-alpha)*withG.x;
    SM.gravY = alpha*SM.gravY + (1-alpha)*withG.y;
    SM.gravZ = alpha*SM.gravZ + (1-alpha)*withG.z;
    x = withG.x - SM.gravX; y = withG.y - SM.gravY; z = withG.z - SM.gravZ;
  } else { return; }

  ingestSample(now, x, y, z);
}

function attachSyntheticMotion(){
  // Only used when DeviceMotion is unsupported, so the feature still demos cleanly.
  SM.syntheticTimer = setInterval(()=>{
    const tt = performance.now()/400;
    const x = Math.sin(tt)*0.04 + (Math.random()-0.5)*0.05;
    const y = Math.cos(tt*1.2)*0.04 + (Math.random()-0.5)*0.05;
    const z = (Math.random()-0.5)*0.05;
    ingestSample(performance.now(), x, y, z);
  }, 100);
}

function ingestSample(now, x, y, z){
  const mag = Math.sqrt(x*x + y*y + z*z);
  SM.lastX=x; SM.lastY=y; SM.lastZ=z; SM.lastMag=mag;

  // Exponential smoothing separates sustained vibration from single-sample sensor noise/spikes.
  const emaAlpha = 0.35;
  SM.smoothedMag = SM.smoothedMag ? (emaAlpha*mag + (1-emaAlpha)*SM.smoothedMag) : mag;

  SM.samples.push({t: now, x, y, z, mag: SM.smoothedMag});
  const cutoff = now - SM_WINDOW_MS;
  while(SM.samples.length && SM.samples[0].t < cutoff) SM.samples.shift();

  if(SM.state === 'calibrating'){
    SM.calibSamples.push(mag);
    const elapsed = now - SM.calibStart;
    const pct = Math.min(100, (elapsed/SM.calibDurationMs)*100);
    document.getElementById('sm-calib-bar').style.width = pct+'%';
    if(elapsed >= SM.calibDurationMs) finishCalibration();
  } else if(SM.state === 'measuring'){
    const threshold = SM.baselineMean + sensitivityMultiplier()*SM.baselineStd;
    if(SM.smoothedMag > threshold){
      SM.aboveCount++; SM.belowCount = 0;
    } else {
      SM.belowCount++;
      if(SM.belowCount > 8) SM.aboveCount = 0; // reset once it's been calm for a while
    }
    // Require several consecutive elevated samples (~sustained, not a single touch/bump) before flagging.
    SM.detected = SM.aboveCount >= 5;
  }
  SM.needsRedraw = true;
}

function seismoLevel(){
  const over = (SM.smoothedMag - SM.baselineMean) / SM.baselineStd;
  if(over < 2) return {key:'smLevelNormal', cls:'normal'};
  if(over < sensitivityMultiplier()) return {key:'smLevelWeak', cls:'weak'};
  if(over < sensitivityMultiplier()*1.8) return {key:'smLevelElevated', cls:'elevated'};
  return {key:'smLevelStrong', cls:'strong'};
}

function updateSeismoStatusUI(){
  const chip = document.getElementById('sm-status-chip');
  if(!chip) return;
  let label = t('smWaiting');
  if(SM.state==='calibrating') label = t('smCalibrating');
  else if(SM.state==='measuring') label = SM.detected ? t('smDetected') : t('smMeasuring');
  chip.textContent = label;

  const lvl = SM.state==='measuring' ? seismoLevel() : {key:'smLevelNormal'};
  const lvlEl = document.getElementById('sm-level-l');
  const lvlN = document.getElementById('sm-level-n');
  if(lvlEl){ lvlEl.textContent = t(lvl.key); }
  if(lvlN){ lvlN.textContent = SM.state==='measuring' ? '●' : '—'; }
  const magEl = document.getElementById('sm-mag-n');
  if(magEl) magEl.textContent = SM.smoothedMag.toFixed(2);

  const xyz = document.getElementById('sm-xyz');
  if(xyz){
    xyz.innerHTML = `
      <div class="sensor-tile ${SM.state==='measuring'?'':'off'}"><div class="v">${SM.lastX.toFixed(2)}</div><div class="u">X · m/s²</div></div>
      <div class="sensor-tile ${SM.state==='measuring'?'':'off'}"><div class="v">${SM.lastY.toFixed(2)}</div><div class="u">Y · m/s²</div></div>
      <div class="sensor-tile ${SM.state==='measuring'?'':'off'}"><div class="v">${SM.lastZ.toFixed(2)}</div><div class="u">Z · m/s²</div></div>`;
  }
}

function startAnimationLoop(){
  const loop = ()=>{
    if(SM.state==='idle' && !SM.motionListener && !SM.syntheticTimer) return;
    if(SM.needsRedraw){ updateSeismoStatusUI(); drawSeismoChart(); SM.needsRedraw=false; }
    SM.rafId = requestAnimationFrame(loop);
  };
  SM.rafId = requestAnimationFrame(loop);
}

function drawSeismoChart(){
  const cv = document.getElementById('seismoChart'); if(!cv) return;
  const ctx = cv.getContext('2d');
  const w=cv.width, h=cv.height;
  ctx.clearRect(0,0,w,h);
  const data = SM.samples;
  if(data.length<2) return;
  const now = data[data.length-1].t;
  const t0 = now - SM_WINDOW_MS;
  const range = 2; // fixed +/-2 m/s² scale keeps the graph readable and stops a single bump from flattening history
  const mid = h/2;
  const plot = (key, color)=>{
    ctx.beginPath();
    data.forEach((d,i)=>{
      const x = ((d.t - t0)/SM_WINDOW_MS)*w;
      const y = mid - (d[key]/range)*mid*0.9;
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    });
    ctx.strokeStyle=color; ctx.lineWidth=1.6; ctx.lineJoin='round'; ctx.stroke();
  };
  ctx.strokeStyle='rgba(32,38,74,.08)'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid); ctx.stroke();
  plot('x', '#f2685f'); plot('y', '#2fc6c2'); plot('z', '#9c7ef0');
}

document.getElementById('sm-sensitivity')?.addEventListener('input', e=>{
  SM.sensitivity = parseInt(e.target.value,10);
});

/* ---------------- scanner ---------------- */
let camStream = null;
async function startScan(){
  const camBox = document.getElementById('camBox');
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    camBox.innerHTML = `<video autoplay playsinline muted></video><div class="scanline"></div>`;
    camBox.querySelector('video').srcObject = camStream;
  }catch(e){
    camBox.innerHTML = `<div class="cam-msg">${t('camUnavail')}</div><div class="scanline"></div>`;
  }
  setTimeout(()=>{
    const objs = [
      {n:'CD/DVD', ok:true},{n: LANG==='en'?'Cardboard':(LANG==='kk'?'Картон':'Картон'), ok:true},
      {n: LANG==='en'?'Smartphone':(LANG==='kk'?'Смартфон':'Смартфон'), ok:true},
      {n: LANG==='en'?'Magnet':(LANG==='kk'?'Магнит':'Магнит'), ok:false},
    ];
    document.getElementById('scanResults').innerHTML =
      objs.map(o=>`<div style="margin:4px 0" class="${o.ok?'badge-ok':'badge-warn'}">${o.ok?'✓':'⚠'} ${o.n} ${o.ok?(LANG==='en'?'detected':(LANG==='kk'?'табылды':'обнаружен')):(LANG==='en'?'missing':(LANG==='kk'?'жоқ':'отсутствует'))}</div>`).join('')
      + `<div style="margin-top:10px;font-weight:700">${t('scanReady')}</div>`;
  }, 1600);
}

/* ---------------- results / projects ---------------- */
function showResults(){
  go('results');
  document.getElementById('res-chip').textContent = currentTpl ? (TEMPLATES[currentTpl].q[LANG]||TEMPLATES[currentTpl].q.en) : t('sensorTitle');
  const avg = chartData.length? (chartData.reduce((a,b)=>a+b,0)/chartData.length).toFixed(2):'0';
  const max = chartData.length? Math.max(...chartData).toFixed(2):'0';
  const min = chartData.length? Math.min(...chartData).toFixed(2):'0';
  document.getElementById('resStats').innerHTML = `
    <div class="stat"><div class="n">${avg}</div><div class="l">avg</div></div>
    <div class="stat"><div class="n">${max}</div><div class="l">max</div></div>
    <div class="stat"><div class="n">${min}</div><div class="l">min</div></div>
    <div class="stat"><div class="n">${chartData.length}</div><div class="l">N</div></div>`;
  drawChart('resChart', chartData);
}
function exportCSV(){
  let csv = "index,value\n" + chartData.map((v,i)=>`${i},${v.toFixed(4)}`).join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'stemcraft_experiment.csv';
  a.click();
}
function saveProject(){
  const name = currentTpl ? (TEMPLATES[currentTpl].q[LANG]||TEMPLATES[currentTpl].q.en) : ('Experiment '+(projects.length+1));
  projects.unshift({name, date: new Date().toISOString().slice(0,10), n: chartData.length, status:'done'});
  localStorage.setItem('sc_projects', JSON.stringify(projects));
  renderProjects();
  go('projects');
}
function renderProjects(){
  const list = document.getElementById('projList');
  if(!projects.length){ list.innerHTML = `<div class="panel">${t('noProj')}</div>`; return; }
  list.innerHTML = projects.map(p=>`
    <div class="card projcard">
      <div><h3 style="margin:0 0 2px">${p.name}</h3><p>${p.date} · ${p.n} pts</p></div>
      <span class="status-pill ${p.status==='done'?'done':'prog'}">${p.status==='done'?(LANG==='en'?'Completed':(LANG==='kk'?'Аяқталды':'Завершено')):(LANG==='en'?'In progress':(LANG==='kk'?'Барысында':'В процессе'))}</span>
    </div>`).join('');
}

/* ---------------- settings ---------------- */
function toggleDemo(){
  demoMode=!demoMode;
  document.getElementById('demoSwitch').classList.toggle('on',demoMode);
  render();
}

/* ---------------- offline ---------------- */
function updateOnline(){
  const pill = document.getElementById('offlinePill');
  if(!navigator.onLine){ pill.textContent = t('offline'); pill.classList.add('show'); }
  else pill.classList.remove('show');
}
window.addEventListener('online', updateOnline);
window.addEventListener('offline', updateOnline);

/* ---------------- init ---------------- */
render();
drawChart('liveChart',[]);
updateOnline();
buildQR();
</script>
